<html lang="en">

    <title>Div and Span</title>

  <body>
    <div>
      <h2>Profile</h2>
      <p>Hello, I am <span>Rishi Kumar Mahato</span>.</p>

      <h2>Education</h2>
      <p>I am graduating from <span>Brainware University</span></p>
    </div>

      <h2>Skills</h2>
      <p>
        I know <span>Java</span>,<span>HTML</span>,<span>C++</span>, and the
        basics of <span>Java Script</span>
      </p>
    </div>
  </body>
</html>
